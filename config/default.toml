# QuickMeet 默认配置（Stage 1）
#
# 加载顺序（后者覆盖前者）：
#   1. 本文件 config/default.toml
#   2. config/local.json（可选，存在才加载，用于私有化现场覆盖）
#   3. 环境变量 QM_SECTION_FIELD（如 QM_MEDIA_PORT=8090 -> media.port）
#      只按**第一个** `_` 分层：QM_MEDIA_SIGNALING_PORT -> media.signaling_port。
#      写错字段名会直接报错，不会静默忽略。
#
# 全局约束（见 Epic YEJ-89）：
#   - 媒体服务默认监听 8080；
#   - 只允许内网网段，默认 192.168.0.0/24；
#   - AI 能力只对接本地部署的硅基流动接口，禁止公网第三方 API；
#   - 音视频 / 会议数据必须本地存储，不得上传公网。

[media]
# 媒体服务监听端口（全局约束：8080）
port = 8080
# 信令 HTTP 服务端口（REST 面：/room/{id}/...，兼容旧客户端）
signaling_port = 8081
# WebSocket 信令端口（QM-004，强制 WSS 面：wss://<host>:8082/）
signaling_ws_port = 8082
# 每个信令房间的参会者上限，0 表示不限制（建议保持 100 以内）
signaling_max_per_room = 100
# 单条信令帧字节上限（1 MiB），超过即断开该连接
signaling_max_frame_bytes = 1048576
# 单会议最大参与者数，0 表示不限制
max_participants = 64
# 会话空闲超时（秒），超时后关闭 PeerConnection 释放资源
idle_timeout_secs = 600

[network]
# 允许的本机 / 对端地址网段。只放行内网，公网地址会被拒绝。
cidrs = ["192.168.0.0/24"]
# 服务绑定地址：绑定具体内网网卡，而不是 0.0.0.0。
# 本机若没有 192.168.0.10 这张网卡，用环境变量覆盖即可，不用改代码：
#   QM_NETWORK_BIND_HOST=127.0.0.1 cargo run --release -- --signal
bind_host = "192.168.0.10"

[logging]
# trace / debug / info / warn / error，支持组合：info,webrtc=debug,qm_media=trace
# 注意：组合之间只能有逗号，逗号后面**不能有空格**，否则后面的 target 会被静默丢弃。
level = "info"
# 日志文件目录；留空则不写文件日志（只写 stdout）
file_dir = ""
# 容器化场景建议打开，便于日志采集器解析
json = false

[storage]
# 会议数据根目录（录音 / 录像 / 事件审计都落在这里，不出域）
data_dir = "./data/meetings"
# 录制文件是否加密（第一阶段保留开关，实现由后续 Issue 提供）
encrypted = false

[ai]
# 第一阶段默认关闭，仅保留接入点
enabled = false
# 本地部署的硅基流动接口；必须是内网地址，禁止公网第三方 API
base_url = "http://127.0.0.1:3000/v1"
timeout_ms = 30000

[auth]
# WebSocket 信令鉴权与 WSS（QM-004）。
#
# 两条强制约束都在这里把关：
#   * enabled = true  —— 未携带有效 JWT 的连接在握手阶段直接拒绝，拿不到任何会议信息；
#   * tls.enabled = true —— 信令通道强制 WSS，禁止明文传输（服务端拒绝以 ws:// 明文启动）。
#
# 环境变量覆盖：QM_AUTH_JWT_SECRET、QM_AUTH_TLSCERT_FILE ...（只按第一个 _ 分层，
# 见 config 加载注释）。

# JWT 强制鉴权总开关。生产必须为 true。
enabled = true
# HS256 对称密钥（≥ 32 字节）。
# ⚠️ 下面这个值**仅为内网联调**，真实部署必须换成现场生成的随机密钥：
#     QM_AUTH_JWT_SECRET="$(openssl rand -base64 48)" docker compose up -d
# 密钥为空且 enabled = true 会直接拒绝启动（防"以为开了其实没开"）。
jwt_secret = "quickmeet-dev-signaling-secret-change-me-32b"
# 签名算法。本期只实现 HS256；RS256 / 外部 IdP 走下方 SSO/OAuth 预留入口。
jwt_algorithm = "HS256"
# token 有效期（秒），默认 24 小时 —— 参会者长会议不会被中途踢下线。
jwt_exp_secs = 86400
# 允许的时钟偏移（秒）。私有化现场 NTP 不干净，留 60 秒窗口。
jwt_clock_skew_secs = 60
# 校验 exp 声明。设为 false 时 token 永不过期，仅用于签发侧演示。
jwt_verify_exp = true
# 允许的 iss 声明。留空则不校验签发方（本地自签）。
jwt_issuer = ""
# 允许的 aud 声明。留空则不校验受众。
jwt_audience = ""
# SSO/OAuth 预留入口：sub 必须包含的域后缀（如 "corp.example"）。留空则不校验。
jwt_required_domain = ""

[auth.tls]
# WSS（信令 WebSocket 的 TLS）。服务启动时强制校验为 true。
enabled = true
# 证书文件路径（PEM）。与 key_file 成对填写；两者都留空则启动时自动生成
# 一张 90 天有效期的自签证书（SAN 含 localhost / 127.0.0.1），浏览器会提示
# 不受信任 —— 私有化交付时请替换为受信任 CA 签发的证书。
cert_file = ""
key_file = ""
# 内联证书 / 私钥 PEM 文本（与 cert_file + key_file 二选一）。
cert_pem = ""
key_pem = ""
# 自签证书的 CN（仅上面两组都留空时生效）。
self_signed_cn = "QuickMeet Signaling"
# 自签证书有效期（天）。
self_signed_days = 90
# 绑定 TLS 监听的地址。留空则使用 network.bind_host。
bind_host = ""
# 最小 TLS 版本。只接受 1.2 / 1.3，其他值拒绝启动。
min_tls_version = "1.2"

[cluster]
# 分布式集群（QM-006）：NATS 房间状态同步 + 最低负载调度 + 健康检查与故障迁移。
#
# 地址合规（全局约束 3/5）：server 与 advertised_addr 必须是内网 IPv4。
# 唯一例外是 127.0.0.1 —— 那是 NATS 与节点同机（sidecar / 本机起 server）的写法，
# 回环流量不离开本机，仍然满足「数据不出域」。公网地址会直接拒绝启动。

# NATS 服务端地址；多节点共享同一个 NATS（本方案的单一协调点）。
server = "127.0.0.1"
# NATS 客户端端口。
port = 4222
# 集群标识：同名集群才共享房间状态与调度视图（测试/生产共用一个 NATS 时不会串）。
cluster_id = "quickmeet"
# 本节点唯一标识；集群内必须唯一，写进心跳与房间归属。
node_id = "node-1"
# 对外通告的媒体地址，供旁听节点回源拉流。多节点部署时每台必须不同。
advertised_addr = "192.168.0.10:8080"
# 节点角色：full = 全功能媒体节点（参与调度）；listener = 旁听分发节点。
node_role = "full"

# 健康检查心跳间隔（秒）。
heartbeat_secs = 5
# 连续错过多少次心跳即判定节点故障。
# 判死窗口 = heartbeat_secs × unhealthy_misses = 5 × 2 = 10s（验收标准 2）。
unhealthy_misses = 2
# 判定故障后，多久内必须完成会议迁移（秒）。
failover_target_secs = 10
# 新节点上线后，多久内必须完成加入并开始承接新会议（秒）。
join_target_secs = 30
# 单次 NATS 请求超时（秒）：必须小于 heartbeat_secs，否则「请求超时」
# 会被误判成「节点故障」。
request_timeout_secs = 3

# 单节点最多承载的会议数（调度硬上限）。
max_rooms_per_node = 64
# 单节点旁听参会者上限（验收标准 3 的容量口径）。
listener_capacity = 20000
# 单条上行流按多少倍只收流观众折算媒体容量。
# 旁听容量 = listener_fanout × listener_capacity = 200 × 20000 = 4,000,000 槽位。
listener_fanout = 200

[room]
# 会议房间管理（QM-005）：密码 / 人数上限 / 等候室 / 主持人权限 / 资源回收。
#
# grace_secs 是验收标准 4 的口径：所有人都离开后保留房间 5 分钟，
# 到点整体释放房间对象、成员表与事件队列，不产生残留占用。
grace_secs = 300
# 单房间事件队列上限（环形截断）：超过就丢最旧的，保证内存有界。
max_events = 256
# 创建房间时未显式指定人数上限则用它；0 表示不限制。
default_max_participants = 64
# 等候室默认开关：开启后非主持人成员先进等候室，等主持人批准。
default_waiting_room = false
# 主持人审核超时（秒）：超时按拒绝处理，参会者不会永远卡在等候室。
approval_timeout_secs = 60
# 预约的会前提醒时机（分钟前）；0 = 不发提醒。
appt_reminder_mins = 15
# 预约开始前多少秒自动创建房间；0 = 正好在开始时刻创建。
appt_auto_create_lead_secs = 60
# 会前提醒通道开关：三条通道都只走内网，不做公网推送。
notify_in_app = true
notify_desktop = true
notify_mobile = true
