[package]
name = "qm-demo"
description = "QuickMeet 可本地运行的 demo：跑通信令服务 + 输出三 codec 收发兼容验证报告"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qm-demo"
path = "src/main.rs"

# `repro` 只被 QM-024 的复现工具（`--repro`）用到。默认不开：
# 容器镜像与 CI 都不需要它，避免把复现专用的 NATS 子进程管理代码带进生产产物。
# 用法：cargo run --manifest-path demos/qm-demo/Cargo.toml --features repro \
#         -- --repro --repro-nats F:/tmp/nats-src/nats-server.exe
[features]
repro = ["dep:futures"]

[dependencies]
qm-common = { path = "../../crates/qm-common" }
qm-media = { path = "../../crates/qm-media" }
qm-signaling = { path = "../../crates/qm-signaling" }
qm-cluster = { path = "../../crates/qm-cluster" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }

# 仅 `repro` 特性用到：从 `async_nats::Subscriber` 拿下一条消息。
# 版本与 qm-cluster 一致（workspace 声明），锁文件不会新增条目。
futures = { workspace = true, optional = true }
