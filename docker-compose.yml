# QuickMeet — docker-compose
#
# 兼容性约束（Epic YEJ-89）：必须能在 docker-compose 1.29.2 下运行，
# 因此本文件**不使用** compose 2.x / docker-compose-plugin 才有的语法：
#   - 没有 deploy: 段（1.29.2 会直接拒绝）
#   - 没有 YAML anchor / alias（v3.x 规范不支持）
#   - 没有 extends: / develop: / secrets: / config:
#   - 没有 include:、没有多行 build.contexts、没有 target:
#   - 重启策略用服务级 restart:（v3 语法），不写在 deploy.restart_policy 里
#   - build 用短语法，context 不越过仓库根目录
#   - 用 environment: 逐服务覆盖节点身份，不靠 anchor 复用
#
# 运行：
#   docker-compose up -d --build        # 1.29.2 的 CLI，不是 docker compose
#   docker-compose ps
#   docker-compose logs -f qm-media
#   docker-compose down
#
# 节点身份说明：3 个媒体节点共用一个 NATS（qm-nats），靠 QM_CLUSTER_NODE_ID
# 与 QM_CLUSTER_ADVERTISED_ADDR 区分自己。扩容只需复制一份 qm-media-* 服务、
# 改这两个变量与端口映射，不需要重建镜像、也不需要重启现有节点。
#
# 媒体节点用 command: 显式传 --cluster（QM-006）进入集群模式：连接 NATS、
# 加入集群、运行心跳/调度/故障迁移循环。Dockerfile 的 CMD 只是默认值
# （不带 --cluster 时跑编解码验证报告就退出），所以集群参数必须在这里写，
# 否则三个节点起来后互不认识。

version: "3.8"

services:
  # NATS 协调点：房间状态同步、节点心跳、调度命令、故障迁移都走它。
  # 只用 core NATS（不启用 JetStream / KV），因此无状态、无磁盘挂载需求。
  qm-nats:
    # 固定 patch 版本，不用 tag：私有化部署要求镜像可复现，
    # 且必须能在断网环境预拉取（不依赖 docker hub 上的 tag 漂移）。
    image: nats:2.10.21-alpine
    container_name: qm-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
    # NATS 自带健康端点（-/-/health），200 即存活。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/-/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - quickmeet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 媒体/编解码层：跑 VP8 / H.264 / Opus 收发兼容验证，并可起信令服务。
  # 同时是本机第一个集群节点（node-1）。
  #
  # 健康探针（QM-018）：集群模式不监听 8081，没有 HTTP 端点可做探针，
  # 所以节点另起一个只读 /healthz（容器内固定 8090，宿主机暴露 8091）。
  # interval 5s × retries 2 = 10s，与配置里的「判死窗口」heartbeat 5s ×
  # misses 2 = 10s 对齐 —— 容器判死和集群判死用同一个口径。
  qm-media:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qm-media
    # 集群模式：不写这里，节点不会进集群（见文件头说明）。
    command:
      - --bind
      - 0.0.0.0
      - --cluster
    restart: unless-stopped
    depends_on:
      - qm-nats
    # 媒体服务默认监听 8080（Epic 全局约束）。
    ports:
      - "8080:8080"
      - "8091:8090"   # 集群健康探针（CI / 运维探活入口）
    # 只绑内网网段：容器网络固定映射到 192.168.0.0/24 的主机侧地址。
    env_file:
      - config/container.env
    # 节点身份：每个集群节点必须覆盖 node_id 与 advertised_addr。
    # 探针端口由 container.env 的 QM_CLUSTER_HEALTH_PORT=8090 统一控制。
    environment:
      - QM_CLUSTER_NODE_ID=node-1
      - QM_CLUSTER_ADVERTISED_ADDR=192.168.0.10:8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s
    volumes:
      - meeting-data:/opt/quickmeet/data
      - meeting-logs:/opt/quickmeet/logs
    networks:
      - quickmeet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 集群节点 2：同一份镜像，只换节点身份与端口映射。
  qm-media-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qm-media-2
    # 集群模式：不写这里，节点不会进集群（见文件头说明）。
    command:
      - --bind
      - 0.0.0.0
      - --cluster
    restart: unless-stopped
    depends_on:
      - qm-nats
    ports:
      - "8082:8080"
      - "8092:8090"   # 集群健康探针
    env_file:
      - config/container.env
    environment:
      - QM_CLUSTER_NODE_ID=node-2
      - QM_CLUSTER_ADVERTISED_ADDR=192.168.0.11:8082
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s
    volumes:
      - meeting-data-2:/opt/quickmeet/data
      - meeting-logs:/opt/quickmeet/logs
    networks:
      - quickmeet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 集群节点 3：3 节点集群部署（验收标准 1）。
  qm-media-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qm-media-3
    # 集群模式：不写这里，节点不会进集群（见文件头说明）。
    command:
      - --bind
      - 0.0.0.0
      - --cluster
    restart: unless-stopped
    depends_on:
      - qm-nats
    ports:
      - "8083:8080"
      - "8093:8090"   # 集群健康探针
    env_file:
      - config/container.env
    environment:
      - QM_CLUSTER_NODE_ID=node-3
      - QM_CLUSTER_ADVERTISED_ADDR=192.168.0.12:8083
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s
    volumes:
      - meeting-data-3:/opt/quickmeet/data
      - meeting-logs:/opt/quickmeet/logs
    networks:
      - quickmeet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 信令服务：独立进程，与媒体层同网段，只做内网信令路由。
  # 扩容媒体节点时不需要再加信令实例 —— 信令只负责内网信令路由。
  qm-signaling:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qm-signaling
    restart: unless-stopped
    depends_on:
      - qm-media
    ports:
      - "8081:8081"
    env_file:
      - config/container.env
    volumes:
      - meeting-data:/opt/quickmeet/data:ro
    networks:
      - quickmeet
    command:
      - --bind
      - 0.0.0.0
      - --signal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 旁听分发节点（可选，验收标准 3 用）：
  #   docker-compose run --rm -d --name qm-listener-1 \
  #     -p 9080:8080 -e QM_CLUSTER_NODE_ID=listener-1 \
  #     -e QM_CLUSTER_ADVERTISED_ADDR=192.168.0.20:9080 \
  #     -e QM_CLUSTER_NODE_ROLE=listener qm-media-2
  #
  # 旁听节点不参与调度（node_role=listener 时 is_schedulable() 为 false），
  # 只承接已分配房间的旁听流转发，可以放大单会议的只收流人数。

networks:
  quickmeet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.0.0/24
          gateway: 192.168.0.1

volumes:
  meeting-data:
  meeting-data-2:
  meeting-data-3:
  meeting-logs:
