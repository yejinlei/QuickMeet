# QuickMeet — docker-compose（QM-015）
#
# 兼容性约束（Epic YEJ-89）：必须能在 **docker-compose 1.29.2** 下运行，
# 因此本文件**不使用** compose 2.x / docker-compose-plugin 才有的语法：
#   - 没有 deploy: 段（1.29.2 会直接拒绝）
#   - 没有 YAML anchor / alias（v3.8 规范不支持）
#   - 没有 extends: / develop: / config: / include:
#     （extends/develop 任何层级都不支持；config/include 是 2.x 顶层语法。
#       服务级 secrets: 在 1.29.2 是**合法**键，本文件只是没用到）
#   - 没有 include:、没有多行 build.contexts、没有 build.target
#   - 重启策略用服务级 restart:（v3 语法），不写在 deploy.restart_policy 里
#   - build 用短语法，context 不越过仓库根目录
#   - 用 environment: 逐服务覆盖节点身份，不靠 anchor 复用
#
# 本机没有 docker 预检不了，所以本文件的语法合规由 CI 兜底：
# `scripts/verify-workflows.sh`（YAML 语义陷阱，workflow 侧）+
# `scripts/verify.sh` 步骤 7/7b（真实 1.29.2 二进制的 `docker-compose config`）。
#
# ── command 的坑（CI 第一次实跑踩过）──────────────────────────────
# command 必须是**完整命令行字符串**，走 shell form。
# Dockerfile 里只有 CMD、没有 ENTRYPOINT，compose 的 command 覆盖的是整个
# Cmd（不是往 ENTRYPOINT 后面追加参数），于是数组形式的
# `command: [--bind, 0.0.0.0, --cluster]` 让 Docker 拿 "--bind" 当可执行文件
# 去 exec，报 `exec: "--bind": executable file not found in $PATH`。
#
# ── 地址模型（容易写错，改前先读这一段）──────────────────────────
# 容器网络**不用** 192.168.0.0/24，保持 Docker 默认 bridge 子网。原因：
# advertised_addr 必须同时被「内网里的浏览器」和「其他容器」访问到，
# 在单机部署下只有**宿主机 IP + 端口映射**能同时满足两边。如果把容器
# 子网也设成 192.168.0.0/24，容器 IP 和宿主机 LAN IP 会变成同一个
# 192.168.0.10 —— 浏览器拿到 advertised_addr 后到底连谁就不可预测了。
#
# 所以各节点的 QM_CLUSTER_ADVERTISED_ADDR 写的是**宿主机侧地址**
# （宿主机内网 IP + 映射出的端口）。其他容器访问这个地址时会走宿主机的
# Docker DNAT 绕一圈（hairpin），功能正确，只是多一跳，集群判活不受影响。
#
# **单机三节点的关键点**：三个节点跑在**同一台宿主机**上，所以三个
# advertised_addr 的 IP 必须**都是同一个宿主机 LAN IP**，只有端口不同
# （8080 / 8082 / 8083）。不要写 192.168.0.11 / 192.168.0.12 ——
# 那两台机器不存在，节点 2/3 会对浏览器和旁听节点广播不可达地址，
# 结果就是集群「看起来 3 节点」但实际互通失败。
#
# 现场改法：如果宿主机内网 IP 不是 192.168.0.10，把三个节点的
# QM_CLUSTER_ADVERTISED_ADDR 的 IP 段**统一**改成宿主机实际 IP（端口保持不变）。
#
# ── 运行 ─────────────────────────────────────────────────────────
#   docker-compose up -d --build        # 1.29.2 的 CLI，不是 docker compose
#   docker-compose ps
#   docker-compose logs -f qm-media
#   docker-compose down
#
# 一键脚本（适配 MobaXterm SSH 操作）：
#   bash scripts/qm-up.sh          # 构建 + 拉起全套 + 等五容器 healthy
#   bash scripts/qm-upgrade.sh     # 拉新代码重建，逐个滚动重启，数据卷不动
#   bash scripts/qm-down.sh        # 停止并移除容器（默认保留数据卷）
#
# ── 节点身份 ─────────────────────────────────────────────────────
# 3 个媒体节点共用一个 NATS（qm-nats），靠 QM_CLUSTER_NODE_ID 与
# QM_CLUSTER_ADVERTISED_ADDR 区分自己。扩容只需复制一份 qm-media-* 服务、
# 改这两个变量与端口映射，不需要重建镜像、也不需要重启现有节点。
#
# 媒体节点用 command: 显式传 --cluster（QM-006）进入集群模式：连接 NATS、
# 加入集群、运行心跳/调度/故障迁移循环。Dockerfile 的 CMD 只是默认值
# （不带 --cluster 时跑编解码验证报告就退出），所以集群参数必须在这里写，
# 否则三个节点起来后互不认识。
#
# ── 故意不写的占位服务（按实际存在的服务编排）──────────────────────
# 本仓库当前**只有一个二进制** qm-demo（见 demos/qm-demo），SFU 的代码在
# qm-sfu crate 里但没有任何进程入口 —— 所以没有单独的 SFU 镜像。以下服务
# 按 Issue 要求留好扩展位，等对应 Issue 交付后解开注释即可：
#
#   # SFU 选择性转发：qm-sfu crate 已实现，尚无独立进程入口（QEJ-91 遗留）。
#   #   qm-sfu:
#   #     build: { context: ., dockerfile: Dockerfile }
#   #     command: "./qm-demo --bind 0.0.0.0 --sfu --cluster"   # 待 QM-002 入口
#   #     ports: ["8080:8080"]
#   #
#   # AI 能力（QM-013）：只对接**本地部署**的硅基流动接口，不启公网 API。
#   # 当前仓库没有 AI 服务的代码，不要凭空起一个容器 —— 会制造假通过。
#   #   qm-ai:
#   #     image: nvidia/siliconflow-vllm:<pin-version>   # 官方镜像，需 pin 版本
#   #     ports: ["3000:3000"]
#   #     volumes: [siliconflow-weights:/weights]
#   #     # 容器外的调用方把 QM_AI_BASE_URL 指到 http://<host>:3000/v1
#   #
#   # 前端（QM-012）：当前没有前端产物，网页端验收无法自证。
#   #   qm-web:
#   #     build: { context: ./web, dockerfile: Dockerfile }   # nginx:alpine 静态托管
#   #     ports: ["80:80"]
#   #     depends_on: [qm-signaling]
#
# ── TURN（QM-008，未交付）────────────────────────────────────────
# 当前所有 ICE 候选都是 host/prflx/srflx，没有 relay（TURN）路径，
# 所以**不要**为 TURN 起容器，也不要给 QM_ICE_TURN_URL 赋真值 ——
# 配置层没有这个键，写了会被判成未知配置项直接拒绝启动（见 container.env）。
#   #   qm-turn:
#   #     image: coturn/coturn:<pin-version>      # 官方镜像，需 pin 版本
#   #     ports: ["3478:3478/udp", "3478:3478/tcp", "49152-49200:49152-49200/udp"]
#   # 解开后同步打开 config/container.env 里的 QM_ICE_TURN_URL（键名以 QM-008 交付为准）。
#
# ── 旁听分发节点（可选，QM-006 验收标准 3 用）────────────────────
#   docker-compose run --rm -d --name qm-listener-1 \
#     -p 9080:8080 -e QM_CLUSTER_NODE_ID=listener-1 \
#     -e QM_CLUSTER_ADVERTISED_ADDR=192.168.0.10:9080 \
#     -e QM_CLUSTER_NODE_ROLE=listener qm-media-2
# 旁听节点不参与调度（node_role=listener 时 is_schedulable() 为 false），
# 只承接已分配房间的旁听流转发，可以放大单会议的只收流人数。

version: "3.8"

services:
  # NATS 协调点：房间状态同步、节点心跳、调度命令、故障迁移都走它。
  # 只用 core NATS（不启用 JetStream / KV），因此无状态、无磁盘挂载需求。
  qm-nats:
    # 固定 patch 版本，不用 tag：私有化部署要求镜像可复现，
    # 且必须能在断网环境预拉取（不依赖 Docker Hub 上的 tag 漂移）。
    image: nats:2.10.21-alpine
    container_name: qm-nats
    restart: unless-stopped
    ports:
      - "4222:4222"      # NATS 客户端
      - "8222:8222"      # 监控/健康端点（-/health 从这里看）
    # NATS 自带健康端点（-/health），200 即存活。alpine 镜像里有 busybox wget。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/-/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - quickmeet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 媒体节点 1（node-1）：同时是本机第一个集群节点。
  #
  # 健康探针：集群模式不监听 8081，没有 HTTP 端点可做探针，
  # 所以节点另起一个只读 /healthz（容器内固定 8090，宿主机暴露 8091）。
  # 探针在 NATS 未连接时返 503（curl -f 判失败），因此：
  #   * start_period 90s —— 吸收 NATS 连接 + 成员心跳收敛的启动协调时间，
  #     避免启动期被算成判死而触发重启风暴；
  #   * interval 5s × retries 3 —— 稳态下的判死窗口（~10s），与配置里
  #     heartbeat 5s × misses 2 = 10s 的集群判死口径对齐。
  # 两个窗口**故意分开**：启动慢不是节点坏了。
  qm-media:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qm-media
    command: "./qm-demo --bind 0.0.0.0 --cluster"
    restart: unless-stopped
    depends_on:
      - qm-nats
    # 媒体服务默认监听 8080（Epic 全局约束 3）。
    ports:
      - "8080:8080"
      - "8091:8090"   # 集群健康探针（CI / 运维探活入口）
    # 现场调参只改这里 / config/container.env，不需要改代码或重建镜像。
    env_file:
      - config/container.env
    # 节点身份：每个集群节点必须覆盖 node_id 与 advertised_addr。
    # advertised_addr 的 IP 是宿主机 LAN IP（不是容器 IP），端口是本节点映射
    # 出来的宿主机端口 —— 见文件头「地址模型」。
    # 探针端口由 container.env 的 QM_CLUSTER_HEALTH_PORT=8090 统一控制。
    environment:
      - QM_CLUSTER_NODE_ID=node-1
      - QM_CLUSTER_ADVERTISED_ADDR=192.168.0.10:8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 90s
    volumes:
      - meeting-data:/opt/quickmeet/data
      - meeting-logs:/opt/quickmeet/logs
    networks:
      - quickmeet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 集群节点 2：同一份镜像，只换节点身份与端口映射。
  qm-media-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qm-media-2
    command: "./qm-demo --bind 0.0.0.0 --cluster"
    restart: unless-stopped
    depends_on:
      - qm-nats
    ports:
      - "8082:8080"
      - "8092:8090"   # 集群健康探针
    env_file:
      - config/container.env
    # 单机三节点：IP 与 node-1 相同（同一台宿主机），只换映射端口。
    # 写成 192.168.0.11 会是不可达地址 —— 那台机器不存在。
    environment:
      - QM_CLUSTER_NODE_ID=node-2
      - QM_CLUSTER_ADVERTISED_ADDR=192.168.0.10:8082
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 90s
    volumes:
      - meeting-data-2:/opt/quickmeet/data
      - meeting-logs:/opt/quickmeet/logs
    networks:
      - quickmeet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 集群节点 3：3 节点集群部署（QM-006 验收标准 1）。
  qm-media-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qm-media-3
    command: "./qm-demo --bind 0.0.0.0 --cluster"
    restart: unless-stopped
    depends_on:
      - qm-nats
    ports:
      - "8083:8080"
      - "8093:8090"   # 集群健康探针
    env_file:
      - config/container.env
    environment:
      - QM_CLUSTER_NODE_ID=node-3
      - QM_CLUSTER_ADVERTISED_ADDR=192.168.0.10:8083
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 90s
    volumes:
      - meeting-data-3:/opt/quickmeet/data
      - meeting-logs:/opt/quickmeet/logs
    networks:
      - quickmeet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 信令服务：独立进程，与媒体层同网段，只做内网信令路由。
  # 扩容媒体节点时不需要再加信令实例 —— 信令只负责内网信令路由。
  #
  # 已知缺口（QM-024 F3，未并入本基线）：`POST /room/{id}/place` 需要信令进程
  # 也接集群，只跑 `--signal` 时该端点返回 503。等 QM-024 合入后把 command
  # 改成 "./qm-demo --bind 0.0.0.0 --signal --cluster" 并加
  # QM_CLUSTER_NODE_ID=node-signal / QM_CLUSTER_NODE_ROLE=listener。
  qm-signaling:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qm-signaling
    restart: unless-stopped
    depends_on:
      - qm-media
    ports:
      - "8081:8081"
    env_file:
      - config/container.env
    volumes:
      - meeting-data:/opt/quickmeet/data:ro
    networks:
      - quickmeet
    command: "./qm-demo --bind 0.0.0.0 --signal"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  quickmeet:
    driver: bridge
    # 刻意**不**写 ipam.config：容器网络用 Docker 默认子网（172.17.0.0/16），
    # 避免与宿主机 192.168.0.0/24 的 LAN 地址重叠。原因见文件头「地址模型」。

# 顶层 volumes 必须是**映射**，写成 list 会被 1.29.2 拒绝。
volumes:
  meeting-data:
  meeting-data-2:
  meeting-data-3:
  meeting-logs:
